
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Seaton Carew Golf Club &mdash; A Personal Invitation</title>
<style>
  :root{
    --paper:#F2EEE3;
    --paper-2:#EAE4D5;
    --ink:#1B1A17;
    --ink-soft:#514E45;
    --rubric:#A2311F;
    --rubric-soft:#B85A46;
    --rule:#c9c2ac;
    --plate-line:#b7ae95;
    /* The nav buttons and the stage's side gutters used to be fixed
       pixel values, sized for a roughly normal (portrait-ish or
       square-ish) embed box. This brochure's box is deliberately held
       at its wide ~2.82:1 spread ratio at every screen size (see
       .full-page.embed-page-wide in the site's globals.css), so on a
       narrow phone the box is only ~100-150px tall in total -- a fixed
       36-42px button then eats a large share of that height, and the
       fixed-pixel gutter no longer matches where the (now much shorter)
       book actually renders, leaving the button sitting on top of the
       book's own edge instead of in blank space beside it. Sizing the
       button off the stage's own height (vh, inside this iframe) fixes
       that at its source for any box shape, instead of patching in a
       narrower fixed size for one more breakpoint. */
    --nav-size: clamp(24px, 16vh, 42px);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'EB Garamond',Georgia,serif;
    overflow:hidden;
  }
  :fullscreen{background:var(--paper);}
::backdrop{background:var(--paper);}
  .wrap{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .stage{
    flex:1 1 auto;
    width:100%;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    /* Side gutters track --nav-size so they always exactly clear the
       (now height-responsive) buttons, at any box shape. */
    padding:16px calc(var(--nav-size) + 20px);
  }
  .stage{overflow:hidden;}
  #book{
    /* The page-flip library only ever sets width:100% on this element
       itself (see autoSize in its own JS); height is left as "auto",
       which for a flex item under align-items:center collapses to its
       (absolutely-positioned, so empty) content height. That leaves the
       book's own canvas -- a child sized at CSS height:100% -- with no
       definite height to resolve against, so the library's internal
       "how much vertical space do I have" measurement doesn't reliably
       track the stage's real height and can compute a book taller than
       actually fits on screen. Giving #book an explicit height ties it
       to the stage's real, current height so that measurement is
       accurate in the embed, in a resized window, and in fullscreen.
       (An earlier attempt replaced this with sizing #book itself to the
       book's exact rendered aspect ratio in JS -- it fixed the
       letterboxing here but introduced a worse regression, the book
       rendering larger than the viewport. Reverted; the embed's own
       aspect-ratio in globals.css is matched to the book's instead, see
       .full-page.embed-page .plate, which fixes the letterboxing at its
       actual source without touching this sizing logic at all.) */
    height:100%;
    box-shadow:0 20px 50px rgba(27,26,23,0.22);
    /* No transition on transform here. The cover-crop centring below
       (updateMasks()) relies on the mask being sized/positioned for
       the shift's FINAL resting place the instant it's applied -- with
       an animated transition, anything that delays a frame (the initial
       flood of 24 images decoding, a slow device, a backgrounded tab)
       can catch the canvas still mid-slide while the mask already sits
       at its settled position, exposing a sliver of the blank half
       underneath. Applying the shift instantly removes that window
       entirely rather than just narrowing it. */
  }
  #book .stf__item{
    background:#fff;
  }
  #book img{
    width:100%;
    height:100%;
    display:block;
    -webkit-user-select:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  /* Every "page" here is really one half of an original print spread
     (see the pages array below), re-paired so the library always shows
     a whole spread at once -- so unlike a book with a lone single-page
     cover, there is no half-filled box to mask here. What IS masked is
     the aspect-fit gap the library's own centring can leave around a
     correctly-filled spread; see updateMasks() below. */
  .edge-mask{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    height:0;
    width:0;
    background:var(--paper);
    pointer-events:none;
    z-index:2;
    opacity:0;
    transition:opacity .2s ease;
  }
  .edge-mask.on{opacity:1;}
  .edge-mask.mask-left{left:0;}
  .edge-mask.mask-right{right:0;}
  /* Same idea as .edge-mask, rotated 90 degrees: the library's aspect-fit
     centring can leave its gap on the horizontal axis (a wide box,
     masked above) OR the vertical axis (a tall/narrow box) depending on
     how the stage's own proportions compare to the brochure's -- never
     both at once, but which one applies can flip as the embed is
     resized. */
  .edge-mask-h{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    background:var(--paper);
    pointer-events:none;
    z-index:2;
    opacity:0;
    transition:opacity .2s ease;
  }
  .edge-mask-h.on{opacity:1;}
  .edge-mask-h.mask-top{top:0;}
  .edge-mask-h.mask-bottom{bottom:0;}
  .nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:var(--nav-size);height:var(--nav-size);
    border-radius:50%;
    border:1px solid var(--plate-line);
    background:var(--paper-2);
    color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .15s ease;
    z-index:5;
  }
  .nav-btn:hover{background:#fff;color:var(--rubric);}
  .nav-btn:active{transform:translateY(-50%) scale(0.94);}
  .nav-btn svg{width:calc(var(--nav-size) * 0.43);height:calc(var(--nav-size) * 0.43);fill:none;stroke:currentColor;stroke-width:2.4;}
  .nav-prev{left:calc(var(--nav-size) * 0.33);}
  .nav-next{right:calc(var(--nav-size) * 0.33);}
  .nav-btn[disabled]{opacity:0.3;cursor:default;}
  footer{
    flex:0 0 auto;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:6px 16px 14px;
    color:var(--ink-soft);
    font-size:13px;
  }
  .pill{
    display:flex;align-items:center;gap:14px;
    background:var(--paper-2);
    border:1px solid var(--plate-line);
    border-radius:999px;
    padding:7px 15px;
  }
  .pill button{
    background:none;border:none;color:var(--ink-soft);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:50%;
    opacity:0.9;
  }
  .pill button:hover{background:rgba(27,26,23,0.08);color:var(--rubric);opacity:1;}
  .pill button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;}
  #pageCount{
    min-width:56px;text-align:center;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    font-family:'IBM Plex Sans Condensed',sans-serif;
    font-size:12px;letter-spacing:.04em;
  }
  .hint{
    font-size:11px;
    font-family:'IBM Plex Sans Condensed',sans-serif;
    color:var(--ink-soft);
    letter-spacing:.04em;
    opacity:.75;
  }
  #loading{
    position:fixed;inset:0;
    background:var(--paper);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;
    z-index:50;
    transition:opacity .4s ease;
  }
  #loading .spin{
    width:30px;height:30px;
    border-radius:50%;
    border:3px solid var(--paper-2);
    border-top-color:var(--rubric);
    animation:spin 0.9s linear infinite;
  }
  #loading p{
    color:var(--ink-soft);font-size:12px;letter-spacing:.04em;
    font-family:'IBM Plex Sans Condensed',sans-serif;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (max-width:640px){
    /* Button size/gutter are handled by --nav-size (vh-based) above at
       every width now, so only the vertical padding and the hint text
       still need a narrow-screen override here. */
    .stage{padding:10px calc(var(--nav-size) + 20px);}
    .hint{display:none;}
  }
</style>
</head>
<body>
<div id="loading"><div class="spin"></div><p>Loading brochure&hellip;</p></div>
<div class="wrap">
  <div class="stage" id="stage">
    <button class="nav-btn nav-prev" id="prevBtn" aria-label="Previous page">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div id="book"></div>
    <div class="edge-mask mask-left" id="maskLeft"></div>
    <div class="edge-mask mask-right" id="maskRight"></div>
    <div class="edge-mask-h mask-top" id="maskTop"></div>
    <div class="edge-mask-h mask-bottom" id="maskBottom"></div>
    <button class="nav-btn nav-next" id="nextBtn" aria-label="Next page">
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
  <footer>
    <div class="pill">
      <button id="firstBtn" aria-label="First page" title="First page">
        <svg viewBox="0 0 24 24"><path d="M18 6L10 12l8 6M6 6v12"/></svg>
      </button>
      <span id="pageCount">1 / 14</span>
      <button id="fsBtn" aria-label="Toggle fullscreen" title="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
      </button>
    </div>
    <span class="hint">Best viewed on a larger screen</span>
  </footer>
</div>

  var pages = ["images/page-01.jpg", "images/page-02.jpg", "images/page-03.jpg", "images/page-04.jpg", "images/page-05.jpg", "images/page-06.jpg", "images/page-07.jpg", "images/page-08.jpg", "images/page-09.jpg", "images/page-10.jpg", "images/page-11.jpg", "images/page-12.jpg", "images/page-13.jpg", "images/page-14.jpg", "images/page-15.jpg", "images/page-16.jpg", "images/page-17.jpg", "images/page-18.jpg", "images/page-19.jpg", "images/page-20.jpg", "images/page-21.jpg", "images/page-22.jpg", "images/page-23.jpg", "images/page-24.jpg", "images/page-25.jpg", "images/page-26.jpg", "images/page-27.jpg", "images/page-28.jpg"];
  var bookEl = document.getElementById('book');
  var stageEl = document.getElementById('stage');
  var loadingEl = document.getElementById('loading');
  var pageCountEl = document.getElementById('pageCount');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var firstBtn = document.getElementById('firstBtn');
  var fsBtn = document.getElementById('fsBtn');

  var PAGE_W = 1240, PAGE_H = 878;

  // Retina / HiDPI fix. The underlying page-flip library sizes its
  // internal <canvas> pixel buffer to exactly match the canvas's CSS
  // display size (see its CanvasUI.resizeCanvas: canvas.width =
  // computedStyleWidth), with no regard for window.devicePixelRatio.
  // On a HiDPI screen (Retina Macs, 4K/5K monitors) that leaves the
  // canvas permanently rendered at 1x and then stretched by the
  // browser to cover the physical pixel grid, which is what makes the
  // page art and text look soft — worse the smaller the book renders,
  // which is why a bigger window/fullscreen looks comparatively sharper.
  //
  // We can't edit the bundled library, so instead we patch the one
  // canvas element it creates: intercept every canvas.width/height
  // assignment it makes (always a CSS-pixel value) and transparently
  // back it with devicePixelRatio-times more physical pixels, scaling
  // the drawing context to match. The library keeps reading and
  // writing the same CSS-pixel numbers it always has; only the actual
  // backing store gets sharper.
  function patchCanvasForHiDPI(canvas){
    var dpr = window.devicePixelRatio || 1;
    if(dpr <= 1 || canvas.__hiDpiPatched) return;
    canvas.__hiDpiPatched = true;
    var ctx = canvas.getContext('2d');
    var widthDesc = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
    var heightDesc = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
    // IMPORTANT: this must NOT also set canvas.style.width/height as a
    // fixed pixel value. The library's own stylesheet already sizes the
    // canvas responsively (".stf__parent canvas{width:100%;height:100%}"
    // relative to #book, which in turn tracks the stage). Worse, for the
    // loadFromImages() path the library measures "available space" by
    // reading the CANVAS's own offsetWidth/offsetHeight back (it's used
    // directly as the size-detection element) -- so pinning style.width
    // to a literal px value here doesn't just stop the canvas from
    // growing, it also permanently freezes the *input* to every future
    // size calculation at whatever the canvas happened to be on first
    // paint, no matter how much the surrounding layout later changes.
    // That was the actual cause of the book staying stuck at its
    // original small size in fullscreen (and on any other resize).
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function(){ return Math.round(widthDesc.get.call(this) / dpr); },
      set: function(cssW){
        widthDesc.set.call(this, Math.round(cssW * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function(){ return Math.round(heightDesc.get.call(this) / dpr); },
      set: function(cssH){
        heightDesc.set.call(this, Math.round(cssH * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    });
    // Re-apply the size the library already set (pre-patch, at 1x)
    // through the patched setters so the very first frame is sharp too.
    var cs = getComputedStyle(canvas);
    canvas.width = parseInt(cs.width, 10);
    canvas.height = parseInt(cs.height, 10);
  }

  // maxWidth is a hard ceiling on a single page's rendered width in the
  // library's "stretch" size mode -- it does not scale with the actual
  // screen, so on a big enough display (a large external monitor, a
  // spacious "more space" scaled resolution) the book hits this cap well
  // before it has filled the available width, leaving plain background
  // down both sides. 1400 was sized for the small embedded box in the
  // page; it's the wrong number for fullscreen, which can be far wider.
  // Raising it well past any real screen's logical width lets the book's
  // own CSS sizing (#book at 100%/100% of the stage) be the only real
  // constraint, so it fills whatever space it's actually given.
  var pageFlip = new St.PageFlip(bookEl, {
    width: PAGE_W,
    height: PAGE_H,
    size: 'stretch',
    minWidth: 200,
    maxWidth: 4000,
    minHeight: 140,
    maxHeight: 2800,
    maxShadowOpacity: 0.5,
    showCover: false,
    // Every original page is a two-image spread reconstructed from a
    // left/right half-image pair (see the pages array above); showing
    // one half alone in single-page "portrait" mode would cut a spread
    // in two, so portrait mode is disabled outright and the book always
    // renders two pages -- one whole spread -- at a time.
    usePortrait: false,
    mobileScrollSupport: false,
    useMouseEvents: true,
    swipeDistance: 20,
    flippingTime: 700
  });

  pageFlip.loadFromImages(pages);

  var __canvasEl = bookEl.querySelector('canvas.stf__canvas');
  if(__canvasEl) patchCanvasForHiDPI(__canvasEl);

  var maskLeft = document.getElementById('maskLeft');
  var maskRight = document.getElementById('maskRight');
  var maskTop = document.getElementById('maskTop');
  var maskBottom = document.getElementById('maskBottom');

  function updateUI(){
    var cur = pageFlip.getCurrentPageIndex();
    var total = pageFlip.getPageCount();
    var totalSpreads = Math.ceil(total / 2);
    var curSpread = Math.min(Math.floor(cur / 2) + 1, totalSpreads);
    pageCountEl.textContent = curSpread + ' / ' + totalSpreads;
    prevBtn.disabled = cur <= 0;
    nextBtn.disabled = cur >= total - 1;
  }

  // Every "page" here is one half of an original spread, re-paired by
  // showCover:false into whole spreads (see the pages array above), so
  // there is never a lone single page needing its own crop/shift -- only
  // the aspect-fit gap the library's "stretch" sizing can leave around a
  // correctly-filled spread needs masking. That gap can land on the
  // sides (a stage proportioned wider than the spread) or on the top and
  // bottom (a stage proportioned narrower/taller than the spread) --
  // never both at once, but which one applies can flip as the embed is
  // resized or fullscreened, so both are always re-checked here.
  function updateMasks(){
    var orientation = pageFlip.getOrientation();
    var rect = pageFlip.getBoundsRect();

    maskLeft.classList.remove('on');
    maskRight.classList.remove('on');
    maskLeft.style.width = '0px';
    maskRight.style.width = '0px';
    maskTop.classList.remove('on');
    maskBottom.classList.remove('on');
    maskTop.style.height = '0px';
    maskBottom.style.height = '0px';
    bookEl.style.transform = 'translateX(0)';

    if(orientation === 'portrait') return;

    // offsetLeft/offsetWidth are layout properties, so they reliably
    // give the gap between the stage edge and the book edge regardless
    // of anything drawn inside the book's own canvas.
    var leftPad = bookEl.offsetLeft;
    var rightPad = stageEl.clientWidth - bookEl.offsetLeft - bookEl.offsetWidth;
    var sideGap = Math.max(0, rect.left);
    if(sideGap > 1){
      maskLeft.style.width = (leftPad + sideGap + 2) + 'px';
      maskLeft.style.height = rect.height + 'px';
      maskLeft.classList.add('on');
      maskRight.style.width = (rightPad + sideGap + 2) + 'px';
      maskRight.style.height = rect.height + 'px';
      maskRight.classList.add('on');
    }

    var topPad = bookEl.offsetTop;
    var bottomPad = stageEl.clientHeight - bookEl.offsetTop - bookEl.offsetHeight;
    var vGap = Math.max(0, rect.top);
    if(vGap > 1){
      maskTop.style.height = (topPad + vGap + 2) + 'px';
      maskTop.style.width = '100%';
      maskTop.classList.add('on');
      maskBottom.style.height = (bottomPad + vGap + 2) + 'px';
      maskBottom.style.width = '100%';
      maskBottom.classList.add('on');
    }
  }

  pageFlip.on('flip', function(){ updateUI(); updateMasks(); });
  pageFlip.on('changeOrientation', function(){ updateMasks(); });
  pageFlip.on('init', function(){
    updateUI();
    updateMasks();
    loadingEl.style.opacity = '0';
    setTimeout(function(){ loadingEl.style.display = 'none'; }, 400);
  });

  prevBtn.addEventListener('click', function(){ pageFlip.flipPrev(); });
  nextBtn.addEventListener('click', function(){ pageFlip.flipNext(); });
  firstBtn.addEventListener('click', function(){ pageFlip.flip(0); });

  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft') pageFlip.flipPrev();
    if(e.key === 'ArrowRight') pageFlip.flipNext();
  });

  // Safari (desktop) only ever exposes the webkit-prefixed fullscreen
  // properties -- document.fullscreenElement stays permanently null
  // there even while genuinely fullscreen -- so any check of "are we
  // currently fullscreen?" has to look at both. Mobile Safari (and any
  // iOS browser, since they all embed WebKit) doesn't support
  // fullscreening arbitrary elements at all, only <video>; feature-detect
  // that and hide the button rather than leave a control that does
  // nothing when tapped.
  function getFsElement(){
    return document.fullscreenElement || document.webkitFullscreenElement || document.webkitCurrentFullScreenElement || null;
  }
  var fsSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  if(!fsSupported){
    fsBtn.style.display = 'none';
  } else {
    fsBtn.addEventListener('click', function(){
      var el = document.documentElement;
      if(!getFsElement()){
        (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
      }
    });
  }

  // The book's own size is driven by page-flip's internal canvas, which
  // only recalculates when explicitly told to. Neither a native 'resize'
  // event nor 'fullscreenchange' can be counted on to reach this
  // document reliably during a fullscreen transition -- tested live and
  // found not to fire consistently (the stage visibly grows to fill the
  // screen via plain CSS layout, but nothing here is ever notified to
  // re-run the canvas-sizing math). A ResizeObserver on the stage
  // sidesteps that entirely: it fires whenever the stage's own rendered
  // box actually changes size, for whatever reason, so it catches the
  // fullscreen transition (and any other layout change) directly
  // instead of inferring it from an event that may not arrive.
  var relayoutTimer = null;
  function forceRelayout(){
    clearTimeout(relayoutTimer);
    relayoutTimer = setTimeout(function(){
      try { pageFlip.update(); } catch(e){}
      updateMasks();
    }, 40);
  }
  if(window.ResizeObserver){
    new ResizeObserver(forceRelayout).observe(stageEl);
  }
  window.addEventListener('resize', forceRelayout);
  document.addEventListener('fullscreenchange', function(){
    [0, 60, 150, 300, 600].forEach(function(delay){ setTimeout(forceRelayout, delay); });
  });
  document.addEventListener('webkitfullscreenchange', function(){
    [0, 60, 150, 300, 600].forEach(function(delay){ setTimeout(forceRelayout, delay); });
  });

  // Fallback: hide loader after a timeout even if 'init' event doesn't fire as expected
  setTimeout(function(){
    if(loadingEl.style.display !== 'none'){
      loadingEl.style.opacity = '0';
      setTimeout(function(){ loadingEl.style.display = 'none'; }, 400);
    }
  }, 4000);
})();
</script>
</body>
</html>
